# Optional. Obeya stores its data in a SQLite file by default and does not need this.
# Use it to try the Postgres option locally:
#   docker compose up -d db
#   DATABASE_URL=postgresql://obeya:obeya@127.0.0.1:5433/obeya
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: obeya
      POSTGRES_PASSWORD: obeya
      POSTGRES_DB: obeya
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - obeya-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obeya -d obeya"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  obeya-db:
